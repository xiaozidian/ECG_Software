name: macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Platform path tests
        run: python -m pytest -q tests/test_config.py
      - name: Python syntax
        run: python -m compileall -q app.py ecg_core tests
      - name: JavaScript syntax
        run: node --check static/js/app.js
