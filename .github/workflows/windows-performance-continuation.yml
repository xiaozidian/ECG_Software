name: Windows1.0.21 aggregate independently accepted native stages

# Reuse only exact producer43295463674 binaries after authenticated failed-step and
# ACL/418/build/PE/policy/source proofs; every native business gate reruns.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-doctor-deidentified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Aggregate verified native stages without executing application
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      ECG_ALLOW_PHI: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      DOCTOR_PACKAGING_VERSION: "1.0.21"
      DOCTOR_SOURCE_VERSION: "M01-24h-v1"
      DOCTOR_RELEASE_NOTES: "优化 ST-T 保存、HRV 更新和正式 PDF 导出；性能更新以逐记录等价验算保留原医生复核、表文图及报告审核。病例默认进入总览。"
    defaults:
      run:
        shell: pwsh
        working-directory: project
    steps:
      - name: Checkout doctor evaluation branch
        uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: project/requirements-doctor-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create clean isolated Windows build environment
        run: |
          python -m venv "$env:RUNNER_TEMP\doctor-build-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\doctor-build-env\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned doctor build dependencies and CI-only browser test tools
        run: |
          python -m pip install -r requirements-doctor-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,subprocess,sys; print('DOCTOR_BUILD_FREEZE_JSON='+json.dumps(subprocess.check_output([sys.executable,'-m','pip','freeze','--all'],text=True).splitlines()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unchanged frozen production source
        run: python scripts/verify_public_release.py
      - name: Bind exact original compiler PE source policy dependencies and original418 proof
        run: |
          python scripts/prepare_windows21_continuation.py --output "$env:RUNNER_TEMP\PERF21-producer" --validator-commit "${{ github.sha }}" --validator-run-id "${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inputs = Get-Content "$env:RUNNER_TEMP\PERF21-producer\continuation21-input.json" -Raw | ConvertFrom-Json
          foreach ($key in @("p01", "full", "software", "source", "p01_build_report", "build_report")) {
            $value = $inputs.paths.$key
            if (-not $value -or -not (Test-Path -LiteralPath $value)) { throw "Missing exact original package: $key" }
            "AGG21_$($key.ToUpper())=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Require fixed M01 P01 success and both independent new native successes plus actual source parity
        run: |
          python -m pytest -p no:cacheprovider -q tests/test_windows21_aggregate.py --junitxml="$env:RUNNER_TEMP\aggregate-controller-tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/aggregate_windows21_acceptance.py --producer-input "$env:RUNNER_TEMP\PERF21-producer\continuation21-input.json" --output "$env:RUNNER_TEMP\aggregate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deliver exact original p01 only after all independently executed native gates pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.21-P01-software-only
          path: |
            ${{ env.AGG21_P01 }}
            ${{ env.AGG21_P01 }}.sha256
            ${{ env.AGG21_P01_BUILD_REPORT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deliver exact original full only after all independently executed native gates pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.21-M01-full
          path: |
            ${{ env.AGG21_FULL }}
            ${{ env.AGG21_FULL }}.sha256
            ${{ env.AGG21_BUILD_REPORT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deliver exact original software only after all independently executed native gates pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.21-software-update
          path: |
            ${{ env.AGG21_SOFTWARE }}
            ${{ env.AGG21_SOFTWARE }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deliver exact original source only after all independently executed native gates pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Synthetic-M01-24h-v1-for-1.0.21
          path: |
            ${{ env.AGG21_SOURCE }}
            ${{ env.AGG21_SOURCE }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain independent native lineage and original failed records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-doctor-eval-mathematical-validation-1.0.21
          path: |
            ${{ runner.temp }}/PERF21-producer/continuation21-input.json
            ${{ runner.temp }}/PERF21-producer/evidence/**/*
            ${{ runner.temp }}/aggregate-controller-tests.xml
            ${{ runner.temp }}/aggregate/**/*
          if-no-files-found: error
          retention-days: 30
