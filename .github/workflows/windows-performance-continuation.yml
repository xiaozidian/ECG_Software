name: Windows1.0.22 original candidate native acceptance
on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Exact successful original22 producer run ID
        required: true
        type: string
      producer_commit:
        description: Exact full original22 producer commit
        required: true
        type: string
      phase:
        description: Independently retained native phase
        required: true
        type: choice
        options:
          - fresh
          - upgrade
          - legacy21ddl
          - m01
          - profile
          - combo
permissions:
  contents: read
  actions: read
concurrency:
  group: windows22-screening-native-${{ inputs.phase }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      ECG_ALLOW_PHI: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      SCREEN22_PRODUCER_RUN: ${{ inputs.producer_run }}
      SCREEN22_PRODUCER_COMMIT: ${{ inputs.producer_commit }}
      ECG_EXPECTED_WINDOWS_BUILD_COMMIT: ${{ inputs.producer_commit }}
    defaults:
      run:
        shell: pwsh
        working-directory: project
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: project/requirements-doctor-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolate pinned controller environment
        run: |
          python -m venv "$env:RUNNER_TEMP\screening22-controller"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\screening22-controller\Scripts" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install controller dependencies
        run: |
          python -m pip install -r requirements-doctor-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict native controller and original input refusal tests
        run: |
          python -m pytest -p no:cacheprovider -q tests/test_windows_screening_quality.py tests/test_windows_legacy_ddl_recovery.py tests/test_windows22_candidate_inputs.py --junitxml="$env:RUNNER_TEMP\screening22-native-controller.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate and fetch original22 producer without rebuild
        if: ${{ inputs.phase != 'profile' && inputs.phase != 'combo' }}
        run: |
          python scripts/prepare_windows22_candidate.py --run "$env:SCREEN22_PRODUCER_RUN" --commit "$env:SCREEN22_PRODUCER_COMMIT" --output "$env:RUNNER_TEMP\screening22-producer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate and fetch original accepted21 baseline
        run: |
          python scripts/prepare_windows22_baseline.py --output "$env:RUNNER_TEMP\screening22-baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual fresh22 screening morphology and doctor save workflow
        if: ${{ inputs.phase == 'fresh' }}
        run: |
          $inputs = Get-Content "$env:RUNNER_TEMP\screening22-producer\candidate22-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_screening_quality.py --software-archive "$($inputs.paths.p01)" --output "$env:RUNNER_TEMP\screening22-native\fresh.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseline = Get-Content "$env:RUNNER_TEMP\screening22-baseline\baseline22-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_p01.py --software-archive "$($inputs.paths.p01)" --math-source-root "$($baseline.paths.math_source)" --output "$env:RUNNER_TEMP\screening22-native\p01.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual original21 to original22 signatures uses RR and HRV retention
        if: ${{ inputs.phase == 'upgrade' }}
        run: |
          $inputs = Get-Content "$env:RUNNER_TEMP\screening22-producer\candidate22-input.json" -Raw | ConvertFrom-Json
          $baseline = Get-Content "$env:RUNNER_TEMP\screening22-baseline\baseline22-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_screening_quality.py --base-software-archive "$($baseline.paths.p01)" --software-archive "$($inputs.paths.p01)" --nonempty-reviewed-scopes --output "$env:RUNNER_TEMP\screening22-native\upgrade21-to22.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolated mathematical reproduction of official21 known lazy-DDL drift
        if: ${{ inputs.phase == 'legacy21ddl' }}
        run: |
          $inputs = Get-Content "$env:RUNNER_TEMP\screening22-producer\candidate22-input.json" -Raw | ConvertFrom-Json
          $baseline = Get-Content "$env:RUNNER_TEMP\screening22-baseline\baseline22-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_screening_quality.py --base-software-archive "$($baseline.paths.p01)" --software-archive "$($inputs.paths.p01)" --nonempty-reviewed-scopes --known-legacy-ddl-fixture --output "$env:RUNNER_TEMP\screening22-native\known21-lazy-DDL-reconciliation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual unchanged M01 complete package three rounds
        if: ${{ inputs.phase == 'm01' }}
        run: |
          $inputs = Get-Content "$env:RUNNER_TEMP\screening22-producer\candidate22-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_doctor_browser_ui21.py --package-root "$($inputs.paths.full_root)" --repeats 3 --output "$env:RUNNER_TEMP\screening22-native\m01-three-rounds.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source-only 24h M01 cold-review timing diagnostic on pinned native dependencies
        if: ${{ inputs.phase == 'profile' }}
        run: |
          python scripts/verify_public_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseline = Get-Content "$env:RUNNER_TEMP\screening22-baseline\baseline22-input.json" -Raw | ConvertFrom-Json
          python -B scripts/profile_m01_stt.py --source . --math-root "$($baseline.paths.math_source)" --out "$env:RUNNER_TEMP\screening22-native\source-profile-wall"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/profile_m01_stt.py --source . --math-root "$($baseline.paths.math_source)" --out "$env:RUNNER_TEMP\screening22-native\source-profile-cprofile" --cprofile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Experimental source-only full M01 baseline versus combo1 exact-body timing
        if: ${{ inputs.phase == 'combo' }}
        run: |
          python scripts/verify_public_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseline = Get-Content "$env:RUNNER_TEMP\screening22-baseline\baseline22-input.json" -Raw | ConvertFrom-Json
          python -B qa/experimental_combo1/run_combo_comparison.py --source . --math-root "$($baseline.paths.math_source)" --out "$env:RUNNER_TEMP\screening22-combo-experiment" --require-windows-pinned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve experimental source-only comparison separately from PE acceptance
        if: ${{ always() && inputs.phase == 'combo' }}
        uses: actions/upload-artifact@v4
        with:
          name: Windows-pinned-source-only-experimental-combo1
          path: |
            ${{ runner.temp }}/screening22-combo-experiment/**/*
            ${{ runner.temp }}/screening22-baseline/baseline22-input.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain distinct native attempt and immutable producer attribution
        if: ${{ always() && inputs.phase != 'combo' }}
        uses: actions/upload-artifact@v4
        with:
          name: Windows-screening-native-1.0.22-${{ inputs.phase }}
          path: |
            ${{ runner.temp }}/screening22-native/**/*
            ${{ runner.temp }}/screening22-producer/candidate22-input.json
            ${{ runner.temp }}/screening22-baseline/baseline22-input.json
            ${{ runner.temp }}/screening22-native-controller.xml
          if-no-files-found: warn
          retention-days: 30
