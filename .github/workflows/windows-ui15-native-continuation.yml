name: Windows UI15 strict original-C5 ZIP native QA continuation

on:
  push:
    branches: ["codex/windows-doctor-deidentified-x64-20261028"]
    paths:
      - '.github/workflows/windows-ui15-native-continuation.yml'
      - 'scripts/prepare_ui15_native_continuation.py'
      - 'scripts/ui15-native-continuation-contract.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-ui15-native-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa15:
    name: Immutable C5 backend proof plus fresh UI oracle performance and all native gates
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONDONTWRITEBYTECODE: "1"
      ECG_ALLOW_PHI: "0"
      DOCTOR_PACKAGING_VERSION: "1.0.15"
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
        working-directory: project
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: project/requirements-doctor-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolated verification controller; no application compilation
        run: |
          python -m venv "$env:RUNNER_TEMP\qa15-controller"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\qa15-controller\Scripts" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Pinned inspectors and installed system Edge
        run: |
          python -m pip install -r requirements-doctor-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools = "$env:RUNNER_TEMP\qa15-node"
          npm install --prefix "$tools" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.63.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $edge = @("$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Installed system Edge missing' }
          "ECG_PLAYWRIGHT_CORE=$tools\node_modules\playwright-core" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_CHROME=$edge" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_CHROME_PATH=$edge" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_DATA_ROOT=$env:RUNNER_TEMP\qa15-math-M01" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_APP_DATA_ROOT=$env:RUNNER_TEMP\qa15-regression-work" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify unchanged runtime40 and exact accepted14 baseline49 plus23
        run: |
          python scripts/verify_public_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_ui15_baseline.py --repository "${{ github.repository }}" --output "$env:RUNNER_TEMP\qa15-baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pin C5 sole invocation failure original873 plus829 and all four immutable ZIPs
        id: inputs
        run: |
          python scripts/prepare_ui15_native_continuation.py --baseline-proof "$env:RUNNER_TEMP\qa15-baseline\baseline-proof.json" --output "$env:RUNNER_TEMP\qa15"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh full UI829 original six Node commands and five native-oracle Demo modes
        run: |
          python scripts/run_windows_ui_tests.py --output "$env:RUNNER_TEMP\qa15\evidence\fresh-ui"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $proof = @()
          foreach ($script in @('tests/chart_source_render.cjs', 'tests/node_full_record_geometry.cjs', 'tests/template_source_render.cjs', 'tests/chart_owner_render.cjs', 'tests/chart_inspection_lifecycle.cjs', 'tests/node_chart_write_owner.cjs')) {
            $renderOutput = & node $script 2>&1
            $renderCode = $LASTEXITCODE
            $renderOutput | Write-Output
            if ($renderCode -ne 0) { exit $renderCode }
            $proof += @{script=$script; exit_code=$renderCode; stdout=($renderOutput -join "`n")}
          }
          $proof | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP\qa15\evidence\render-contracts.json" -Encoding utf8
          python -m pytest -q tests/test_demo_full_record_overview.py --junitxml="$env:RUNNER_TEMP\qa15\evidence\demo-full-record.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh request equivalence and three latency repetitions
        run: |
          python scripts/verify_windows_request_source_perf.py --output "$env:RUNNER_TEMP\qa15\evidence\windows-request-source-perf.json" --rounds 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual unchanged C5 full15 interactions and CI-only same-schema16 updater fixture
        run: |
          $qaInputs = Get-Content "$env:RUNNER_TEMP\qa15\continuation-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_doctor_browser.py --package-root "$($qaInputs.paths.full_root)" --software-archive "$($qaInputs.paths.upgrade16_fixture)" --output "$env:RUNNER_TEMP\qa15\evidence\native\browser-validation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual unchanged C5 P01 source save reopen and update
        run: |
          $qaInputs = Get-Content "$env:RUNNER_TEMP\qa15\continuation-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_p01.py --software-archive "$($qaInputs.paths.p01)" --math-source-root "$env:RUNNER_TEMP\qa15-math-M01" --output "$env:RUNNER_TEMP\qa15\evidence\native\p01-native.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual unchanged C5 current29 ST and AF report independent mathematical oracle
        run: |
          $qaInputs = Get-Content "$env:RUNNER_TEMP\qa15\continuation-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_ui15_report_native.py --software-archive "$($qaInputs.paths.p01)" --output "$env:RUNNER_TEMP\qa15\evidence\native\report-evidence-native.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual14 to exact C5 15 preserves reviewed report basis acknowledgements and UUID ledger
        run: |
          $qaInputs = Get-Content "$env:RUNNER_TEMP\qa15\continuation-input.json" -Raw | ConvertFrom-Json
          python scripts/verify_windows_ui15_upgrade.py --base-software-archive "$($qaInputs.paths.base14_p01)" --software-archive "$($qaInputs.paths.p01)" --output "$env:RUNNER_TEMP\qa15\evidence\native\ui15-upgrade-native.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict composite verdict; original C5 ZIPs remain unchanged and producer stays failure
        run: |
          python scripts/prepare_ui15_native_continuation.py --output "$env:RUNNER_TEMP\qa15" --finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original C5 scopes and fresh QA native evidence without patient material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-UI15-C5-immutable-native-QA
          path: ${{ runner.temp }}/qa15/evidence
          if-no-files-found: warn
          retention-days: 30
