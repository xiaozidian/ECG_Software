name: Windows1.0.22 ST-T screening candidate producer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows22-screening-producer
  cancel-in-progress: false
jobs:
  producer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      ECG_ALLOW_PHI: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
        working-directory: project
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: project/requirements-doctor-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create isolated pinned build environment
        run: |
          python -m venv "$env:RUNNER_TEMP\screening22-build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\screening22-build\Scripts" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-doctor-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce independent screening policy on native compiler
        run: |
          python scripts/build_screening_policy.py --parents screening-parent-engines.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- screening-refinement-compatibility.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_public_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Screening contracts and package boundary preflight
        run: |
          python -m pytest -p no:cacheprovider -q tests/test_stt_candidate_quality.py tests/test_stt_candidate_screening_integration.py tests/test_screening_compatibility.py tests/test_screening_continuity_transaction.py tests/test_screening_certificate_cache.py tests/test_windows_screening_package_assets.py tests/test_windows_doctor_build.py tests/test_windows_deidentified_package.py tests/test_shared_source.py tests/test_static_demo_builder.py --junitxml="$env:RUNNER_TEMP\screening22-preflight.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch exact accepted21 software and unchanged mathematical M01
        run: |
          python scripts/prepare_windows22_baseline.py --output "$env:RUNNER_TEMP\screening22-baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile native candidate once and prepare source-free P01
        id: compile
        run: |
          $baseline = Get-Content "$env:RUNNER_TEMP\screening22-baseline\baseline22-input.json" -Raw | ConvertFrom-Json
          python scripts/windows_doctor_build.py --output "$env:RUNNER_TEMP\screening22-build-output" --source-commit "${{ github.sha }}" --version "1.0.22" --source-root "$($baseline.paths.math_source)" --source-version "M01-24h-v1" --release-notes "ST-T 0.5形态质量筛查，与房颤独立；原测量与医生复核按独立筛查升级连续性核对。" --verification-upgrade-version "auto" --ci-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows_deidentified_package.py template --software-archive "$env:RUNNER_TEMP\screening22-build-output\CardioInsight-DoctorEval-Windows-x64-1.0.22-software.zip" --output "$env:RUNNER_TEMP\screening22-p01"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact producer P01 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.22-P01-software-only
          path: |
            ${{ runner.temp }}/screening22-p01/CardioInsight-DoctorEval-Windows-x64-1.0.22-P01-software.zip
            ${{ runner.temp }}/screening22-p01/CardioInsight-DoctorEval-Windows-x64-1.0.22-P01-software.zip.sha256
            ${{ runner.temp }}/screening22-p01/p01-software-build-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve exact producer full and software candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.22-M01-software-and-full
          path: |
            ${{ runner.temp }}/screening22-build-output/CardioInsight-DoctorEval-Windows-x64-1.0.22-full.zip
            ${{ runner.temp }}/screening22-build-output/CardioInsight-DoctorEval-Windows-x64-1.0.22-full.zip.sha256
            ${{ runner.temp }}/screening22-build-output/CardioInsight-DoctorEval-Windows-x64-1.0.22-software.zip
            ${{ runner.temp }}/screening22-build-output/CardioInsight-DoctorEval-Windows-x64-1.0.22-software.zip.sha256
            ${{ runner.temp }}/screening22-build-output/build-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve unchanged original synthetic source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Synthetic-M01-24h-v1-for-1.0.22
          path: |
            ${{ runner.temp }}/screening22-baseline/math/CardioInsight-Synthetic-M01-24h-v1.zip
            ${{ runner.temp }}/screening22-baseline/math/CardioInsight-Synthetic-M01-24h-v1.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve producer diagnostics separately from native acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-screening-candidate-producer-validation-1.0.22
          path: |
            ${{ runner.temp }}/screening22-preflight.xml
            ${{ runner.temp }}/screening22-baseline/baseline22-input.json
            ${{ runner.temp }}/screening22-build-output/evidence/**/*
            ${{ runner.temp }}/screening22-build-output/build-report.json
            ${{ runner.temp }}/screening22-p01/p01-software-build-report.json
          if-no-files-found: warn
          retention-days: 30
