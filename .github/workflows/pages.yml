name: Deploy mathematical evaluation demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static builder dependency
        run: python -m pip install "Jinja2>=3.1,<4"
      - name: Verify frozen evaluation source
        run: python scripts/verify_public_release.py
      - name: Build browser-only mathematical demo
        run: python scripts/build_static_demo.py
      - name: Check demo JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          for asset in sorted(Path('build/pages/static/js').glob('*.js')):
              subprocess.run(['node', '--check', str(asset)], check=True)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
