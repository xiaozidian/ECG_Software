name: Windows UI-only repack 1.0.12 (same27 binary; math CI only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-doctor-deidentified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Native Windows x64 UI repack and unchanged-evidence acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      ECG_ALLOW_PHI: "0"
      DOCTOR_PACKAGING_VERSION: "1.0.12"
      DOCTOR_SOURCE_VERSION: "M01-24h-v1"
      DOCTOR_RELEASE_NOTES: "逐导联ST/T分钟证据与连续事件，房颤多代表图条，医院式波形菜单与任意位置留图。"
    defaults:
      run:
        shell: pwsh
        working-directory: project
    steps:
      - name: Checkout doctor evaluation branch
        uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: project/requirements-doctor-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create clean isolated Windows build environment
        run: |
          python -m venv "$env:RUNNER_TEMP\doctor-build-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\doctor-build-env\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned doctor build dependencies and CI-only browser test tools
        run: |
          python -m pip install -r requirements-doctor-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,subprocess,sys; print('DOCTOR_BUILD_FREEZE_JSON='+json.dumps(subprocess.check_output([sys.executable,'-m','pip','freeze','--all'],text=True).splitlines()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure CI-only Node tests with installed system Edge
        run: |
          $jsTools = "$env:RUNNER_TEMP\doctor-node-browser"
          New-Item -ItemType Directory -Path $jsTools -Force | Out-Null
          npm install --prefix "$jsTools" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.63.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $edgeCandidates = @("$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe")
          $edgePath = @($edgeCandidates | Where-Object { Test-Path $_ })[0]
          if (-not $edgePath) { throw "Installed system Microsoft Edge is unavailable." }
          "ECG_PLAYWRIGHT_CORE=$jsTools\node_modules\playwright-core" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_CHROME=$edgePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_CHROME_PATH=$edgePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify release production source fingerprint
        run: python scripts/verify_public_release.py
      - name: Generate only the existing continuous mathematical M01 input
        run: |
          python scripts/generate_doctor_24h.py --output "$env:RUNNER_TEMP\doctor-math-M01"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ECG_DATA_ROOT=$env:RUNNER_TEMP\doctor-math-M01" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_APP_DATA_ROOT=$env:RUNNER_TEMP\doctor-regression-work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download exact code-verified27 binary and original failed runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = gh api repos/${{ github.repository }}/actions/runs/41598666103 | ConvertFrom-Json
          if ($base.conclusion -ne 'failure' -or $base.head_sha -ne 'cfb5d732eae7fbf938bd8fab6a31ca4cd2b9bc3b') { throw 'Code-verified27 candidate baseline mismatch' }
          gh run download 41598666103 --repo "${{ github.repository }}" --pattern '*1.0.11*' --dir "$env:RUNNER_TEMP\code-verified27"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repack only existing80 UI assets; reuse exact EXE and non-UI runtime
        id: nativebuild
        run: |
          python scripts/repack_windows_ui.py `
            --base-root "$env:RUNNER_TEMP\code-verified27" `
            --output "$env:RUNNER_TEMP\doctor-eval" `
            --source-commit "${{ github.sha }}" `
            --base-commit "cfb5d732eae7fbf938bd8fab6a31ca4cd2b9bc3b" `
            --base-run "41598666103" `
            --base-exe-sha256 "6f6de01b7935c9da8a63cfb5f140289335e8636590b4aa04ce0f1c6729b79a7d" `
            --ci-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify immutable27 backend and performance reuse with actual EXE and PYZ equality
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_ui_repack_baseline.py `
            --base-root "$env:RUNNER_TEMP\code-verified27" `
            --software-archive "$env:RUNNER_TEMP\doctor-p01\CardioInsight-DoctorEval-Windows-x64-1.0.12-P01-software.zip" `
            --base-exe-sha256 "6f6de01b7935c9da8a63cfb5f140289335e8636590b4aa04ce0f1c6729b79a7d" `
            --repository "${{ github.repository }}" `
            --output "$env:RUNNER_TEMP\doctor-core\composed-backend-proof.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\doctor-core\baseline27" -Force | Out-Null
          foreach ($name in @('test-summary.json','test-scope.json','scoped-tests.xml','historical-af.xml','windows-request-source-perf.json')) {
            $files = @(Get-ChildItem "$env:RUNNER_TEMP\code-verified27" -Recurse -File -Filter $name)
            if ($files.Count -ne 1) { throw "Ambiguous baseline receipt $name" }
            Copy-Item $files[0].FullName "$env:RUNNER_TEMP\doctor-core\baseline27\$name"
          }
      - name: Fresh UI2 Windows JS CSS HTML wrappers including navigation pending curation and height
        run: |
          python scripts/run_ui_repack_tests.py --output "$env:RUNNER_TEMP\doctor-core"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: System Edge full software interaction and retained-source update validation
        run: |
          $buildReport = Get-Content "$env:RUNNER_TEMP\doctor-eval\build-report.json" -Raw | ConvertFrom-Json
          $upgradeArchive = $buildReport.verification_upgrade_fixture.archive
          python scripts/verify_windows_doctor_browser.py `
            --package-root "$env:RUNNER_TEMP\doctor-eval\verify-package\CardioInsight-DoctorEval-Windows-x64" `
            --software-archive "$env:RUNNER_TEMP\doctor-eval\$upgradeArchive" `
            --output "$env:RUNNER_TEMP\doctor-eval\evidence\browser-validation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual frozen P01 source save reopen and update using mathematical fixture only
        run: |
          python scripts/verify_windows_p01.py `
            --software-archive "$env:RUNNER_TEMP\doctor-p01\CardioInsight-DoctorEval-Windows-x64-1.0.12-P01-software.zip" `
            --math-source-root "$env:RUNNER_TEMP\doctor-math-M01" `
            --output "$env:RUNNER_TEMP\doctor-p01\evidence\p01-native.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent mathematical ST and multi-AF report evidence on the actual EXE
        run: |
          python scripts/verify_windows_report_evidence_native.py --software-archive "$env:RUNNER_TEMP\doctor-p01\CardioInsight-DoctorEval-Windows-x64-1.0.12-P01-software.zip" --output "$env:RUNNER_TEMP\doctor-p01\evidence\report-evidence-native.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual27 to UI2 upgrade keeps reviewed evidence in the same P01 workspace
        run: |
          $baseP01 = @(Get-ChildItem "$env:RUNNER_TEMP\code-verified27" -Recurse -File -Filter '*1.0.11-P01-software.zip')[0].FullName
          python scripts/verify_windows_ui_upgrade_native.py `
            --base-software-archive "$baseP01" `
            --software-archive "$env:RUNNER_TEMP\doctor-p01\CardioInsight-DoctorEval-Windows-x64-1.0.12-P01-software.zip" `
            --output "$env:RUNNER_TEMP\doctor-p01\evidence\ui-upgrade-native.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain built source-free P01 binary; native verdict is separate
        if: always() && steps.nativebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.12-P01-software-only
          path: |
            ${{ runner.temp }}/doctor-p01/CardioInsight-DoctorEval-Windows-x64-1.0.12-P01-software.zip
            ${{ runner.temp }}/doctor-p01/CardioInsight-DoctorEval-Windows-x64-1.0.12-P01-software.zip.sha256
            ${{ runner.temp }}/doctor-p01/p01-software-build-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload full M01 mathematical portable package
        if: always() && steps.nativebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.12-M01-full
          path: |
            ${{ runner.temp }}/doctor-eval/CardioInsight-DoctorEval-Windows-x64-1.0.12-full.zip
            ${{ runner.temp }}/doctor-eval/CardioInsight-DoctorEval-Windows-x64-1.0.12-full.zip.sha256
            ${{ runner.temp }}/doctor-eval/build-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload M01 software-only update package
        if: always() && steps.nativebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.12-software-update
          path: |
            ${{ runner.temp }}/doctor-eval/CardioInsight-DoctorEval-Windows-x64-1.0.12-software.zip
            ${{ runner.temp }}/doctor-eval/CardioInsight-DoctorEval-Windows-x64-1.0.12-software.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload separate unchanged synthetic M01 input
        if: always() && steps.nativebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Synthetic-M01-24h-v1-for-1.0.12
          path: |
            ${{ runner.temp }}/doctor-eval/CardioInsight-Synthetic-M01-24h-v1.zip
            ${{ runner.temp }}/doctor-eval/CardioInsight-Synthetic-M01-24h-v1.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload public mathematical validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-doctor-eval-mathematical-validation-${{ env.DOCTOR_PACKAGING_VERSION }}
          path: |
            ${{ runner.temp }}/doctor-p01/evidence/*
            ${{ runner.temp }}/doctor-regression/*.json
            ${{ runner.temp }}/doctor-core/**/*.json
            ${{ runner.temp }}/doctor-core/**/*.png
            ${{ runner.temp }}/doctor-core/*.xml
            ${{ runner.temp }}/doctor-previous/fetch-receipt.json
            ${{ runner.temp }}/doctor-baseline*.xml
            ${{ runner.temp }}/doctor-current*.xml
            ${{ runner.temp }}/doctor-eval/evidence/*.json
            ${{ runner.temp }}/doctor-eval/ui-repack-verification.json
            ${{ runner.temp }}/doctor-core/**/*.xml
            ${{ runner.temp }}/doctor-eval/evidence/browser-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
