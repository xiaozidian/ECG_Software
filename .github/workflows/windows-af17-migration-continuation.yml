name: Windows1.0.17 original15 migration after accepted current native flows

# Build426439/bdcdf produced the exact fresh17 PE and four original ZIPs.
# Current-native426674/e982 passed full software, P01 and new ST-T/AF flows.
# This run proves the remaining actual original15 migration, retaining both
# earlier overall failures and all three distinct source/acceptance identities.

on:
  push:
    branches: ["codex/windows-doctor-deidentified-x64-20261028"]
    paths: [".github/workflows/windows-af17-migration-continuation.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-doctor-deidentified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Native Windows x64 package and current workstation acceptance
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      ECG_ALLOW_PHI: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      DOCTOR_PACKAGING_VERSION: "1.0.17"
      DOCTOR_SOURCE_VERSION: "M01-24h-v1"
      DOCTOR_RELEASE_NOTES: "ST段改变、持续T倒置、低平和双相并行筛查；连续满1分钟形成n分钟事件，与房颤独立；房颤整段多图审阅、最终报告按事件分组，统一入报与历史证据保护。"
    defaults:
      run:
        shell: pwsh
        working-directory: project
    steps:
      - name: Checkout doctor evaluation branch
        uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: project/requirements-doctor-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create clean isolated Windows build environment
        run: |
          python -m venv "$env:RUNNER_TEMP\doctor-build-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\doctor-build-env\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned doctor build dependencies and CI-only browser test tools
        run: |
          python -m pip install -r requirements-doctor-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,subprocess,sys; print('DOCTOR_BUILD_FREEZE_JSON='+json.dumps(subprocess.check_output([sys.executable,'-m','pip','freeze','--all'],text=True).splitlines()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure CI-only Node tests with installed system Edge
        run: |
          $jsTools = "$env:RUNNER_TEMP\doctor-node-browser"
          New-Item -ItemType Directory -Path $jsTools -Force | Out-Null
          npm install --prefix "$jsTools" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.63.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $edgeCandidates = @("$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe")
          $edgePath = @($edgeCandidates | Where-Object { Test-Path $_ })[0]
          if (-not $edgePath) { throw "Installed system Microsoft Edge is unavailable." }
          "ECG_PLAYWRIGHT_CORE=$jsTools\node_modules\playwright-core" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_CHROME=$edgePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_CHROME_PATH=$edgePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify unchanged frozen production source fingerprint
        run: python scripts/verify_public_release.py
      - name: Bind original compile and actual passed current-native flows to remaining migration
        run: |
          python scripts/prepare_windows17_migration_continuation.py --output "$env:RUNNER_TEMP\af17-migration" --acceptance-commit "${{ github.sha }}" --acceptance-run-id "${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inputs = Get-Content "$env:RUNNER_TEMP\af17-migration\migration17-input.json" -Raw | ConvertFrom-Json
          if ($inputs.source_compile_commit -ne "bdcdf2343a0fb2cecbb157b4a3fba54de6a13333" -or $inputs.compile_producer_run_id -ne 42643976501) { throw "Compile producer identity differs." }
          foreach ($key in @("full_root", "p01", "full", "software", "source", "p01_build_report", "build_report", "current_native_qa_root")) {
            $value = $inputs.paths.$key
            if (-not $value -or -not (Test-Path $value)) { throw "Missing original bound path: $key" }
            "AF17_$($key.ToUpper())=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Fetch exact accepted15 P01 and immutable M01 source with original failure attribution
        run: |
          python scripts/prepare_windows17_baseline.py --output "$env:RUNNER_TEMP\af17-baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inputs = Get-Content "$env:RUNNER_TEMP\af17-baseline\baseline17-input.json" -Raw | ConvertFrom-Json
          "ECG_DATA_ROOT=$($inputs.paths.math_source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECG_APP_DATA_ROOT=$env:RUNNER_TEMP\doctor-migration-work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate remaining migration and three-role source provenance contracts
        run: |
          python -m pytest -p no:cacheprovider -q tests/test_windows_af17_migration_continuation.py --junitxml="$env:RUNNER_TEMP\doctor-migration-controller-tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual original15 to original fresh17 same-workspace reviewed report and UUID retention
        run: |
          $inputs = Get-Content "$env:RUNNER_TEMP\af17-baseline\baseline17-input.json" -Raw | ConvertFrom-Json
          $env:ECG_OLD_ORACLE_PROOF_PATH = "$env:RUNNER_TEMP\doctor-native\evidence\old15-oracle-dependencies.json"
          python scripts/verify_windows_af_multistrip_native.py --base-software-archive "$($inputs.paths.p01)" --software-archive "$env:AF17_P01" --source-compile-commit "bdcdf2343a0fb2cecbb157b4a3fba54de6a13333" --producer-run-id 42643976501 --controller-commit "${{ github.sha }}" --acceptance-run-id "${{ github.run_id }}" --output "$env:RUNNER_TEMP\doctor-native\evidence\upgrade15-to17-native.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove original full17 source payload equals original unchanged source archive
        run: |
          python scripts/prepare_windows17_baseline.py --baseline-proof "$env:RUNNER_TEMP\af17-baseline\baseline17-input.json" --package-root "$env:AF17_FULL_ROOT" --output "$env:RUNNER_TEMP\doctor-native\evidence\original-M01-payload-parity.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deliver original source-free P01 software after actual native and migration acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.17-P01-software-only
          path: |
            ${{ env.AF17_P01 }}
            ${{ env.AF17_P01 }}.sha256
            ${{ env.AF17_P01_BUILD_REPORT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deliver original full M01 software after actual native and migration acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.17-M01-full
          path: |
            ${{ env.AF17_FULL }}
            ${{ env.AF17_FULL }}.sha256
            ${{ env.AF17_BUILD_REPORT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deliver original software update after actual native and migration acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Windows-x64-1.0.17-software-update
          path: |
            ${{ env.AF17_SOFTWARE }}
            ${{ env.AF17_SOFTWARE }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deliver original unchanged mathematical source after actual acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CardioInsight-Synthetic-M01-24h-v1-for-1.0.17
          path: |
            ${{ env.AF17_SOURCE }}
            ${{ env.AF17_SOURCE }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain compile failure and current-native success separately from actual migration verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-doctor-eval-mathematical-validation-1.0.17
          path: |
            ${{ runner.temp }}/af17-migration/migration17-input.json
            ${{ runner.temp }}/af17-migration/evidence/**/*
            ${{ runner.temp }}/af17-migration/original-producer/evidence/**/*
            ${{ runner.temp }}/af17-migration/original-producer/continuation17-input.json
            ${{ runner.temp }}/af17-baseline/baseline17-input.json
            ${{ runner.temp }}/doctor-migration-controller-tests.xml
            ${{ runner.temp }}/doctor-native/evidence/**/*
          if-no-files-found: error
          retention-days: 30
